// ruff: ignore
syntax = "proto3";

package orca_teleop;

// A single frame of hand landmark data from any input device.
// The publisher (operator side) streams these to the robot side.
message HandFrame {
  // 63 floats: 21 landmarks × 3 coordinates (x, y, z), row-major.
  // Coordinates are in meters, wrist-relative, following MediaPipe convention.
  repeated float keypoints = 1;

  // "left" or "right"
  string handedness = 2;

  // Nanosecond timestamp from the publisher's clock.
  int64 timestamp_ns = 3;

  // Relative wrist flexion from publishers that provide a wrist pose.
  // Publishers without wrist tracking leave this at zero.
  float wrist_angle_degrees = 4;

  // Full wrist pose: 16 floats, a row-major 4x4 rigid transform in the
  // publisher's FLU world frame (x forward, y left, z up), translation in
  // meters. Needed to drive an arm, which requires the wrist *position* that
  // wrist_angle_degrees discards. Publishers without a wrist pose leave this
  // empty; consumers must treat an empty field as "not available" rather than
  // as identity.
  repeated float wrist_transform = 5;

  // Clutch, driven by the operator's other hand: the arm follows only while it
  // is engaged, so the operator can reposition without dragging the robot.
  //
  // Two fields rather than one because "this session has no clutch" and "the
  // clutch is released" must stay distinguishable. The first means follow
  // unconditionally, which is what a webcam publisher needs; the second means
  // freeze. Collapsing them would make an untracked off hand read as
  // permission to move, which is the wrong direction to fail in.
  bool clutch_supported = 6;
  bool clutch_engaged = 7;

  // One-shot: operator asked to re-run hand retargeter auto-scale (e.g. off-hand
  // fist). Consumers should reset calibration state and wait for a fresh window.
  bool retarget_recalibrate = 8;
}

// Configuration sent by the robot when a publisher connects.
message StreamConfig {
  // Which hand the robot wants data for ("left" or "right").
  string handedness = 1;
}

// Acknowledgement after the stream ends.
message StreamSummary {
  int64 frames_received = 1;
}

// The single service that all publishers implement.
// Robot side runs the server; publishers connect as clients and stream frames.
service HandStream {
  // Publisher opens a stream and continuously sends HandFrames.
  // The robot responds with a summary when the stream closes.
  rpc StreamHandFrames (stream HandFrame) returns (StreamSummary);
}
