# Candidate refinement of the working adaptive --pinch profile; explicitly select with --retarget-config.
# Baseline remains unchanged. Actual mesh/pad contact is not guaranteed by tip-frame distance.
optimizer:
  type: adaptive_analytical
retarget:
  huber_delta_cm: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  lp_alpha: 1.0
  w_pos: 1.0
  w_dir: 10.0
  w_full_hand: 1.0
  w_pinch: 4.0
  # One line/second: live pair activation and commanded angles, no motor reads.
  pinch_diagnostics: true
  # Release a conflicting palm-relative tip-position objective during pinches.
  # Same smooth rule for all pairs; preserve direction and full-chain posture.
  pinch_relax_tip_position: true
  # Direct thumb IP flexion only in free motion (no active pinch pair).
  # As pinch activates, fade out human IP bend matching so contact can win.
  # Input is MCP->IP vs IP->tip; URDF rest bend is derived by FK.
  # Physical ROM and output velocity bounds still apply.
  thumb_ip_tracking: direct_free
  # Free-motion bend weight; zero at full pinch activation for any enabled pair.
  w_thumb_ip_bend: 5.0
  thumb_ip_bend_scope: free
  # Existing pair priorities remain. No extra curl/offset or ROM change.
  # Kinematic improvement is not proof of real pad contact.
  pinch_pair_weights:
    index: 1.0
    middle: 2.0
    ring: 2.0
    pinky: 2.0
  # Continuous distance mapping plus an elapsed-time bound on closing/release.
  # Local adaptation; these numerical settings are not paper-prescribed values.
  pinch_smooth_transition: true
  pinch_max_joint_velocity_deg_s: 60.0
  pinch_alpha_max: 0.7
  scaling: 1.0
  segment_scaling:
    thumb:
    - 1.0
    - 1.0
    - 1.0
    index:
    - 1.0
    - 1.03
    - 1.1
    middle:
    - 1.0
    - 1.0
    - 1.0
    ring:
    - 1.0
    - 1.0
    - 1.0
    pinky:
    - 1.05
    - 1.15
    - 1.15
  pinch_thresholds_cm:
    index:
      d1: 2.0
      d2: 5.0
    middle:
      d1: 2.0
      d2: 5.0
    ring:
      d1: 2.0
      d2: 5.0
    pinky:
      d1: 2.0
      d2: 5.0
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0
