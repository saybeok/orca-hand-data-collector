optimizer:
  type: adaptive_analytical
retarget:
  huber_delta_cm: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  lp_alpha: 1.0
  w_pos: 1.0
  w_dir: 10.0
  w_full_hand: 1.0
  w_pinch: 4.0
  pinch_diagnostics: true
  pinch_relax_tip_position: true
  thumb_ip_tracking: direct_free
  w_thumb_ip_bend: 5.0
  thumb_ip_bend_scope: free
  pinch_pair_weights:
    index: 1.0
    middle: 2.0
    ring: 2.0
    pinky: 2.0
  pinch_smooth_transition: true
  pinch_max_joint_velocity_deg_s: 60.0
  pinch_alpha_max: 0.7
  scaling: 1.0
  segment_scaling:
    thumb:
    - 1.0
    - 1.0
    - 1.0
    index:
    - 1.0
    - 1.03
    - 1.1
    middle:
    - 1.0
    - 1.0
    - 1.0
    ring:
    - 1.0
    - 1.0
    - 1.0
    pinky:
    - 1.05
    - 1.15
    - 1.15
  pinch_thresholds_cm:
    index:
      d1: 2.0
      d2: 5.0
    middle:
      d1: 2.0
      d2: 5.0
    ring:
      d1: 2.0
      d2: 5.0
    pinky:
      d1: 2.0
      d2: 5.0
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  surface_contact_calibration: ../data/contact_calibration/full_hand_surface.json
  # Keep index/middle at 8 mm; close ring/pinky an additional 2 mm.
  # Separate runtime tuning; recorded contacts and fitted biases remain unchanged.
  surface_contact_closure_margin_mm:
    index: 8.0
    middle: 8.0
    ring: 10.0
    pinky: 10.0
robot_frames:
  right:
    palm: right_palm
    fingers:
      thumb:
        pip: right_thumb_ip
        dip: right_thumb_dp
        tip: right_thumb_fingertip
      index:
        pip: right_index_pip
        dip: right_index_ip
        tip: right_index_fingertip
      middle:
        pip: right_middle_pip
        dip: right_middle_ip
        tip: right_middle_fingertip
      ring:
        pip: right_ring_pip
        dip: right_ring_ip
        tip: right_ring_fingertip
      pinky:
        pip: right_pinky_pip
        dip: right_pinky_ip
        tip: right_pinky_fingertip
  left:
    palm: left_palm
    fingers:
      thumb:
        pip: left_thumb_ip
        dip: left_thumb_dp
        tip: left_thumb_fingertip
      index:
        pip: left_index_pip
        dip: left_index_ip
        tip: left_index_fingertip
      middle:
        pip: left_middle_pip
        dip: left_middle_ip
        tip: left_middle_fingertip
      ring:
        pip: left_ring_pip
        dip: left_ring_ip
        tip: left_ring_fingertip
      pinky:
        pip: left_pinky_pip
        dip: left_pinky_ip
        tip: left_pinky_fingertip
