optimizer:
  type: adaptive_analytical
retarget:
  # Fingertip-to-palm distance shrinks with folded fingers and inflates scale.
  scale_calibration: bone_lengths
  wrist_input_scale: 2.0
  huber_delta_cm: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  lp_alpha: 1.0
  w_pos: 1.0
  w_dir: 10.0
  w_full_hand: 1.0
  w_pinch: 4.0
  # AKO-inspired hand-only objective in the existing adaptive optimizer:
  # relative fingertip vectors + distal direction + complementary shape.
  # URDF tip origins are kinematic proxies, not measured physical pad points.
  pinch_objective: relative_vector
  # Free long-finger posture: copy bone directions onto the robot's own
  # lengths/MCP origins; keep distal direction tracking on outside pinches.
  # Explicit in saved session configs to distinguish the earlier vector mode.
  long_finger_tracking: bone_directions
  # During pinch retain MCP->PIP direction as well as distal direction.
  # Discourages over-flexing MCP while straightening PIP to match a tip.
  # Soft orientation objective, not a joint-angle floor or recorded pose.
  w_pinch_proximal_dir: 20.0
  pinch_diagnostics: true
  pinch_relax_tip_position: true
  thumb_ip_tracking: direct_free
  # Double positive IP travel around the same joint zero in free motion AND
  # pinch. Fading 2x to 1x on approach instructed the tip to straighten even
  # when the operator held the same bend. ROM/velocity bounds still apply.
  # This is operator tuning, not a measurement of anatomical tracking accuracy.
  thumb_ip_bend_gain: 2.0
  # Keep measured IP flexion in the objective even when a fingertip is close.
  # Fading it out allowed the pinch solver to straighten a visibly bent thumb.
  w_thumb_ip_bend: 50.0
  thumb_ip_bend_scope: always
  pinch_pair_weights:
    # Apply the same objective/priority to every thumb-finger pair.
    index: 8.0
    middle: 8.0
    ring: 8.0
    pinky: 8.0
  pinch_smooth_transition: true
  # Human relative direction and continuously rescaled distance remain the
  # target throughout the pinch. No frozen entry vector or recorded pose.
  pinch_target_mode: landmark
  pinch_max_joint_velocity_deg_s: 60.0
  pinch_alpha_max: 0.7
  scaling: 1.0
  # Long-finger shape lengths come from FK, without empirical segment scales.
  pinch_thresholds_cm:
    index:
      # Auto-scaled landmark distance: zero target gap at 3 cm or closer,
      # blending continuously back to ordinary tracking by 5 cm.
      # These are auto-scaled distances, not DexPilot hysteresis switches.
      d1: 3.0
      d2: 5.0
    middle:
      d1: 2.0
      d2: 5.0
    ring:
      d1: 2.0
      d2: 5.0
    pinky:
      d1: 2.0
      d2: 5.0
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  # No nearest-hull distance or extra penetration margin in this objective.
  # The passive 24-pose data remain available for independent diagnostics.
robot_frames:
  right:
    palm: right_palm
    fingers:
      thumb:
        pip: right_thumb_ip
        dip: right_thumb_dp
        tip: right_thumb_fingertip
      index:
        pip: right_index_pip
        dip: right_index_ip
        tip: right_index_fingertip
      middle:
        pip: right_middle_pip
        dip: right_middle_ip
        tip: right_middle_fingertip
      ring:
        pip: right_ring_pip
        dip: right_ring_ip
        tip: right_ring_fingertip
      pinky:
        pip: right_pinky_pip
        dip: right_pinky_ip
        tip: right_pinky_fingertip
  left:
    palm: left_palm
    fingers:
      thumb:
        pip: left_thumb_ip
        dip: left_thumb_dp
        tip: left_thumb_fingertip
      index:
        pip: left_index_pip
        dip: left_index_ip
        tip: left_index_fingertip
      middle:
        pip: left_middle_pip
        dip: left_middle_ip
        tip: left_middle_fingertip
      ring:
